<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>稚拙风演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e7e3;color:#252523;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
.deck,.toolbar{width:1280px;margin:28px auto}.toolbar{display:flex;gap:16px;align-items:center;font-size:14px;color:#74746d}
button{font:inherit;padding:9px 16px;background:white;border:1px solid #ccc;cursor:pointer}
.slide{position:relative;width:1280px;height:720px;padding:60px 78px;background:#fff;margin-bottom:28px;overflow:hidden}
h1{font-weight:500;font-size:54px;line-height:1.17;letter-spacing:-1px;margin:36px 0 20px}
p{font-size:22px;line-height:1.7;margin:0;color:#74746d}.accent{color:#e6532f}
.columns{display:flex;gap:48px;margin-top:42px}.columns>*{flex:1;min-width:0}
.art{max-width:100%;height:260px;object-fit:contain;image-rendering:pixelated}
.number{position:absolute;right:66px;bottom:38px;font-size:13px;color:#999}
table{width:100%;border-collapse:collapse;font-size:19px}th,td{text-align:left;padding:18px 12px 18px 0;border-bottom:1px solid #ecece7}th{font-size:14px;font-weight:500;color:#888}
@media(max-width:1320px){.deck,.toolbar{margin-left:20px;margin-right:20px}}
@media print{@page{size:1280px 720px;margin:0}body{background:#fff}.toolbar{display:none}.deck{margin:0}.slide{margin:0;break-after:page;page-break-after:always}}
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">打印 / 保存 PDF</button><button onclick="copySource()">复制完整 HTML 源码</button><span id="status"></span></div>
<main class="deck">
<section class="slide"><h1>Replace with a Clear Title</h1><p>替换为具体、易讲述的中文说明。</p><div class="columns"><div><p class="accent">替换为这一页的核心问题。</p></div><div><!-- Embed a generated illustration here using a data URL. --></div></div><div class="number">01</div></section>
</main>
<script>
async function copySource(){const source='<!doctype html>\n'+document.documentElement.outerHTML;try{await navigator.clipboard.writeText(source);document.getElementById('status').textContent='已复制'}catch{const input=document.createElement('textarea');input.value=source;document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();document.getElementById('status').textContent=ok?'已复制':'复制失败，请通过查看网页源代码复制'}}
</script>
</body></html>
